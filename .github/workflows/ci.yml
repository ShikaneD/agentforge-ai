name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AgentForge.slnx
      - run: dotnet build AgentForge.slnx --no-restore --configuration Release
      - run: dotnet test AgentForge.slnx --no-build --configuration Release
      - run: dotnet tool restore
      - run: dotnet tool run dotnet-ef migrations script --idempotent --project src/AgentForge.Infrastructure/AgentForge.Infrastructure.csproj --startup-project src/AgentForge.Api/AgentForge.Api.csproj --output /tmp/agentforge-migration.sql

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
